<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dash e Pipe</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="shell">
    <header class="brand"><span>D</span><div><strong>Dash e Pipe</strong><small>Companion</small></div></header>
    <section class="hero">
      <p class="eyebrow">WhatsApp Web</p>
      <h1 id="contact-name">Conversa atual</h1>
      <p id="contact-phone" class="muted">Buscando contexto…</p>
      <div class="actions">
        <button id="open-app" class="primary">Abrir no Dash e Pipe</button>
        <button id="refresh" class="secondary">Atualizar</button>
      </div>
    </section>
    <section class="card">
      <label for="app-url">URL do Dash e Pipe</label>
      <input id="app-url" type="url" />
      <button id="save-url" class="secondary full">Salvar ambiente</button>
      <p class="hint">A extensão não envia mensagens nem acessa seu token do WhatsApp. Ela só usa o contexto visível do chat para abrir a busca correspondente no Dash e Pipe.</p>
    </section>
    <p id="status" class="status"></p>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
